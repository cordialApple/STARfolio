name: AWS demo checks
permissions:
  contents: read
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
jobs:
  gateway-and-lifecycle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd
        with:
          terraform_version: '1.15.5'
          terraform_wrapper: false
      - name: Install gateway test dependencies
        run: >-
          python -m pip install --require-hashes --only-binary=:all:
          -r demo/moshi-gateway/requirements-test.lock
      - name: Validate production dependency locks
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r .github/requirements/aws-demo.lock
          uv pip compile .github/requirements/aws-demo.in --python-version 3.12 --python-platform x86_64-manylinux_2_28 --generate-hashes --no-build --exclude-newer 2026-09-19T00:00:00Z --output-file .github/requirements/aws-demo.lock
          uv pip compile demo/moshi-gateway/requirements-runtime.in --python-version 3.12 --python-platform x86_64-manylinux_2_28 --generate-hashes --no-build --exclude-newer 2026-09-19T00:00:00Z --output-file demo/moshi-gateway/requirements.lock
          uv pip compile demo/moshi-gateway/requirements-build.in --python-version 3.12 --python-platform x86_64-manylinux_2_28 --generate-hashes --no-build --exclude-newer 2026-09-19T00:00:00Z --output-file demo/moshi-gateway/requirements-build.lock
          uv pip compile demo/moshi-gateway/requirements.txt --python-version 3.12 --python-platform x86_64-manylinux_2_28 --generate-hashes --no-build --exclude-newer 2026-09-19T00:00:00Z --output-file demo/moshi-gateway/requirements-test.lock
          git diff --exit-code -- .github/requirements/aws-demo.lock demo/moshi-gateway/requirements.lock demo/moshi-gateway/requirements-build.lock demo/moshi-gateway/requirements-test.lock
      - name: Validate pinned Moshi build
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r demo/moshi-gateway/requirements-build.lock
          git init --quiet /tmp/moshi-rag
          git -C /tmp/moshi-rag remote add origin https://github.com/kyutai-labs/moshi-rag.git
          git -C /tmp/moshi-rag fetch --depth 1 origin 8c6dfc101b7871baa428424bcdc583b74fb561d9
          git -C /tmp/moshi-rag checkout --detach 8c6dfc101b7871baa428424bcdc583b74fb561d9
          python demo/moshi-gateway/verify_moshi_source.py /tmp/moshi-rag/moshi/moshi
          python -m pip wheel --no-build-isolation --no-deps --wheel-dir /tmp/moshi-wheel /tmp/moshi-rag/moshi
          python -m pip install --no-deps /tmp/moshi-wheel/*.whl
          python -c "import importlib.util,pathlib,subprocess,sys; spec=importlib.util.find_spec('moshi'); root=pathlib.Path(next(iter(spec.submodule_search_locations))); subprocess.check_call([sys.executable,'demo/moshi-gateway/verify_moshi_source.py',str(root)])"
      - name: Run gateway integration tests
        run: python -m unittest discover -s demo/moshi-gateway -v
      - name: Run AWS lifecycle unit tests
        run: python -m unittest discover -s infra/aws-demo -v
      - name: Check worker shell syntax
        run: |
          bash -n demo/moshi-gateway/bootstrap.sh
          bash -n demo/moshi-gateway/diagnostics.sh
          bash -n demo/moshi-gateway/run-worker.sh
      - name: Validate generated infrastructure
        run: |
          python -c "import json; digest='a'*64; json.dump({'name':'starfolio-demo','region':'us-east-2','ami':'ami-0123456789abcdef0','ami_owner':'123456789012','subnet':'subnet-0123456789abcdef0','vpc':'vpc-0123456789abcdef0','hours':0.6666666666666666,'bundle_s3_uri':f's3://demo-artifacts/moshi/{digest}.tar.gz','bundle_sha256':digest,'hf_token_secret_arn':'arn:aws:secretsmanager:us-east-2:123456789012:secret:starfolio/huggingface-test'},open('/tmp/starfolio-config.json','w'))"
          python infra/aws-demo/demo.py plan --config /tmp/starfolio-config.json --terraform-dir /tmp/starfolio-terraform
          python -c "import base64,json; config=json.load(open('/tmp/starfolio-terraform/main.tf.json')); open('/tmp/starfolio-user-data.sh','wb').write(base64.b64decode(config['resource']['aws_instance']['worker']['user_data_base64']))"
          bash -n /tmp/starfolio-user-data.sh
          terraform fmt -check infra/aws-demo/tests
          cp -r infra/aws-demo/tests /tmp/starfolio-terraform/tests
          terraform -chdir=/tmp/starfolio-terraform init -backend=false -input=false -lockfile=readonly
          terraform -chdir=/tmp/starfolio-terraform validate
          terraform -chdir=/tmp/starfolio-terraform test
      - name: Build worker archive
        run: python infra/aws-demo/demo.py pack --output /tmp/starfolio-demo.tar.gz
