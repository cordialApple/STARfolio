name: PBT observation retention

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

jobs:
  validate:
    if: >
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    permissions:
      actions: read
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install trusted retention code
        working-directory: app
        run: npm ci

      - name: Download main source cycle
        uses: actions/download-artifact@v4
        with:
          name: pbt-observations-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
          path: ${{ runner.temp }}/pbt-incoming
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Revalidate source cycle
        working-directory: app
        run: npm run pbt:stage
        env:
          PBT_RETENTION_MODE: validate
          PBT_OBSERVATION_PRIVATE_KEYS: ${{ secrets.PBT_OBSERVATION_PRIVATE_KEYS }}
          PBT_SPOOL_DIR: ${{ runner.temp }}/pbt-incoming
          PBT_PUBLICATION_DIR: ${{ runner.temp }}/pbt-validated
          PBT_RUN_ID: ${{ github.event.workflow_run.id }}
          PBT_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          PBT_REPOSITORY_SHA: ${{ github.event.workflow_run.head_sha }}
          PBT_REPOSITORY_BRANCH: ${{ github.event.workflow_run.head_branch }}
          PBT_WORKFLOW: ${{ github.event.workflow_run.name }}
          PBT_JOB: build-and-test

      - name: Transfer validated cycle
        uses: actions/upload-artifact@v4
        with:
          name: validated-pbt-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
          path: |
            ${{ runner.temp }}/pbt-validated/${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}/manifest.json
            ${{ runner.temp }}/pbt-validated/${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}/payload.enc
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 1

  retain:
    needs: validate
    concurrency:
      group: pbt-observation-retention
      cancel-in-progress: false
    permissions:
      actions: read
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install trusted retention code
        working-directory: app
        run: npm ci

      - name: Download validated cycle
        uses: actions/download-artifact@v4
        with:
          name: validated-pbt-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
          path: ${{ runner.temp }}/pbt-validated

      - name: Append durable cycle
        working-directory: app
        run: npm run pbt:retain
        env:
          GIT_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PBT_RETENTION_WORKSPACE: ${{ runner.temp }}/pbt-retention-workspace
          PBT_RETENTION_REMOTE: https://github.com/${{ github.repository }}.git
          PBT_VALIDATED_CYCLE_DIR: ${{ runner.temp }}/pbt-validated
          PBT_RUN_ID: ${{ github.event.workflow_run.id }}
          PBT_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
